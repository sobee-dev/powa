

  <header class="sticky  top-0 z-60 backdrop-blur mb-14">

      <nav class="md:text-[18px] hidden md:flex items-center gap-9 text-sm text-gray-900">

        <a href="{{url_for('controller.contact_us')}}" class="hover:text-green-600">Contact us</a>
      </nav>
      <div class="hidden md:flex items-center  gap-4">

        <span class="absolute w-6 h-0.5 bg-green-500 transition-all duration-300 ease-in-out group-[.open]:opacity-0"></span>

  <script>
// ===== For mobile menu button =====
  const button = document.getElementById('menu-toggle');
  const menu = document.getElementById('mobile-menu');
  if (button && menu) {
    button.addEventListener('click', () => {
      menu.classList.toggle('hidden');
      button.classList.toggle('open');
    });
  }
 </script>
